<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Exam Fullscreen Background -->
  <rect width="1440" height="900" fill="#F8FAFC"/>

  <!-- Top Pearson Exam Header -->
  <rect width="1440" height="70" fill="#0F172A"/>
  <text x="32" y="42" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="18" font-weight="700">PTE Academic Official Mock Test #04</text>
  <rect x="420" y="20" width="160" height="32" rx="16" fill="#1E293B"/>
  <text x="500" y="41" text-anchor="middle" fill="#26C6DA" font-family="Inter, sans-serif" font-size="13" font-weight="600">Section 1: Speaking</text>

  <!-- Timer Countdown Box -->
  <rect x="1220" y="16" width="180" height="38" rx="8" fill="#EF4444"/>
  <text x="1310" y="40" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="700">⏱ 00:32:45 Left</text>

  <!-- Main Question Card (Left 1000px) -->
  <rect x="32" y="94" width="980" height="690" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Question Title &amp; Instructions -->
  <rect x="56" y="118" width="140" height="28" rx="6" fill="#FEE2E2"/>
  <text x="126" y="137" text-anchor="middle" fill="#DC2626" font-family="Inter, sans-serif" font-size="12" font-weight="700">QUESTION 3 OF 36</text>

  <text x="56" y="180" fill="#0F172A" font-family="Inter, sans-serif" font-size="20" font-weight="700">Read Aloud</text>
  <text x="56" y="210" fill="#64748B" font-family="Inter, sans-serif" font-size="14">Look at the text below. In 40 seconds, you must read this text aloud as naturally and clearly as possible. You have 40 seconds to read.</text>

  <!-- Prompt Passage Box -->
  <rect x="56" y="240" width="932" height="180" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="285" fill="#1E293B" font-family="Inter, sans-serif" font-size="17" font-weight="400">"Modern psychology has developed significantly over the past century, transitioning from</text>
  <text x="80" y="320" fill="#1E293B" font-family="Inter, sans-serif" font-size="17" font-weight="400">philosophical inquiries into empirical science. By combining neuroimaging technologies with</text>
  <text x="80" y="355" fill="#1E293B" font-family="Inter, sans-serif" font-size="17" font-weight="400">rigorous behavioral experiments, researchers continue to uncover the intricate neural mechanisms</text>
  <text x="80" y="390" fill="#1E293B" font-family="Inter, sans-serif" font-size="17" font-weight="400">underlying human decision-making and cognitive memory."</text>

  <!-- Status &amp; Microphone Indicator -->
  <rect x="56" y="450" width="932" height="150" rx="10" fill="#F1F5F9"/>
  <text x="522" y="495" text-anchor="middle" fill="#0F172A" font-family="Inter, sans-serif" font-size="16" font-weight="600">Current Status: Beginning in 12 seconds</text>
  
  <!-- Preparation Progress Bar -->
  <rect x="222" y="520" width="600" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="222" y="520" width="420" height="10" rx="5" fill="#26C6DA"/>
  <text x="522" y="560" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="13">Preparation Time Remaining: 12 / 40s</text>

  <!-- Bottom Navigation Buttons -->
  <rect x="56" y="710" width="140" height="46" rx="8" fill="#F1F5F9"/>
  <text x="126" y="738" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="14" font-weight="600">← Previous</text>

  <rect x="848" y="710" width="140" height="46" rx="8" fill="#26C6DA"/>
  <text x="918" y="738" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Next Question →</text>

  <!-- Right Question Palette Panel (380px) -->
  <rect x="1036" y="94" width="372" height="690" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1060" y="135" fill="#0F172A" font-family="Inter, sans-serif" font-size="16" font-weight="700">Question Palette</text>

  <text x="1060" y="170" fill="#64748B" font-family="Inter, sans-serif" font-size="13">Speaking (1 - 10)</text>
  
  <!-- Question Grid Circles -->
  <!-- Q1 Answered (Green) -->
  <circle cx="1080" cy="210" r="18" fill="#10B981"/>
  <text x="1080" y="215" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700">1</text>

  <!-- Q2 Answered (Green) -->
  <circle cx="1130" cy="210" r="18" fill="#10B981"/>
  <text x="1130" y="215" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700">2</text>

  <!-- Q3 Current (Teal Outline) -->
  <circle cx="1180" cy="210" r="18" fill="#E0F7FA" stroke="#26C6DA" stroke-width="2"/>
  <text x="1180" y="215" text-anchor="middle" fill="#00838F" font-family="Inter, sans-serif" font-size="12" font-weight="700">3</text>

  <!-- Q4-10 Unanswered (Grey) -->
  <circle cx="1230" cy="210" r="18" fill="#F1F5F9"/>
  <text x="1230" y="215" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">4</text>

  <circle cx="1280" cy="210" r="18" fill="#F1F5F9"/>
  <text x="1280" y="215" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">5</text>

  <circle cx="1330" cy="210" r="18" fill="#F1F5F9"/>
  <text x="1330" y="215" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">6</text>

  <circle cx="1080" cy="260" r="18" fill="#F1F5F9"/>
  <text x="1080" y="265" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">7</text>

  <circle cx="1130" cy="260" r="18" fill="#F1F5F9"/>
  <text x="1130" y="265" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">8</text>

  <circle cx="1180" cy="260" r="18" fill="#F1F5F9"/>
  <text x="1180" y="265" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">9</text>

  <circle cx="1230" cy="260" r="18" fill="#F1F5F9"/>
  <text x="1230" y="265" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">10</text>

  <!-- Writing Section -->
  <text x="1060" y="320" fill="#64748B" font-family="Inter, sans-serif" font-size="13">Writing (11 - 16)</text>
  <circle cx="1080" cy="360" r="18" fill="#F1F5F9"/>
  <text x="1080" y="365" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">11</text>
  <circle cx="1130" cy="360" r="18" fill="#F1F5F9"/>
  <text x="1130" y="365" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">12</text>
  <circle cx="1180" cy="360" r="18" fill="#F1F5F9"/>
  <text x="1180" y="365" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">13</text>
  <circle cx="1230" cy="360" r="18" fill="#F1F5F9"/>
  <text x="1230" y="365" text-anchor="middle" fill="#64748B" font-family="Inter, sans-serif" font-size="12" font-weight="600">14</text>

  <!-- Submit Exam Button -->
  <rect x="1060" y="710" width="324" height="46" rx="8" fill="#EF4444"/>
  <text x="1222" y="738" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="700">Finish &amp; Submit Exam</text>
</svg>
