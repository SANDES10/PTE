<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTEMaster - Figma UI Design Suite (Desktop & Mobile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      background: #00b2b4;
      color: white;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0, 178, 180, 0.4);
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
    }
    .device-switcher {
      display: flex;
      background: #0b1120;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #334155;
      gap: 4px;
    }
    .device-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .device-btn.active {
      background-color: #00b2b4;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 178, 180, 0.4);
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .tab-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover {
      background-color: #1e293b;
      color: #f1f5f9;
    }
    .tab-btn.active {
      background-color: #1e293b;
      color: #00b2b4;
      border: 1px solid #00b2b4;
    }
    main {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }
    .screen-view {
      display: none;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .screen-view.hidden {
      display: none !important;
    }
    .desktop-card {
      width: 100%;
      max-width: 1440px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: none;
    }
    .desktop-card.active {
      display: block;
      animation: fadeIn 0.25s ease-out;
    }
    .desktop-card svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .mobile-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .mobile-card {
      width: 390px;
      max-width: 100%;
      background: #ffffff;
      border-radius: 44px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 8px #1e293b, 0 0 0 10px #334155;
      overflow: hidden;
      display: none;
    }
    .mobile-card.active {
      display: block;
      animation: fadeIn 0.25s ease-out;
    }
    .mobile-card svg {
      width: 100%;
      height: auto;
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    footer {
      text-align: center;
      padding: 1.25rem;
      color: #64748b;
      font-size: 13px;
      border-top: 1px solid #1e293b;
      background: #0b1120;
    }
  </style>
</head>

      <button class="device-btn" id="btn-mode-mobile" onclick="switchDevice('mobile')">📱 Mobile App</button>
    </div>

    <!-- Desktop Tabs -->
    <div class="nav-tabs" id="desktop-tabs">
      <button class="tab-btn active" onclick="showDesktop('d-landing', this)">🌐 Landing</button>
      <button class="tab-btn" onclick="showDesktop('d-dashboard', this)">📊 Dashboard</button>
      <button class="tab-btn" onclick="showDesktop('d-mocktest', this)">📝 Mock Test</button>
      <button class="tab-btn" onclick="showDesktop('d-analytics', this)">📈 Analytics & Report</button>

    <!-- Mobile Tabs -->
    <div class="nav-tabs" id="mobile-tabs" style="display: none;">
      <button class="tab-btn active" onclick="showMobile('m-dashboard', this)">📱 Home App</button>
      <button class="tab-btn" onclick="showMobile('m-practice', this)">🎙️ Speech Practice</button>

  <script>
    function switchDevice(mode) {
      const desktopView = document.getElementById("desktop-view");
      const mobileView = document.getElementById("mobile-view");
      const desktopTabs = document.getElementById("desktop-tabs");
      const mobileTabs = document.getElementById("mobile-tabs");
      const btnDesktop = document.getElementById("btn-mode-desktop");
      const btnMobile = document.getElementById("btn-mode-mobile");

      if (mode === "desktop") {
        desktopView.classList.remove("hidden");
        mobileView.classList.add("hidden");
        desktopTabs.style.display = "flex";
        mobileTabs.style.display = "none";
        btnDesktop.classList.add("active");
        btnMobile.classList.remove("active");
      } else {
        desktopView.classList.add("hidden");
        mobileView.classList.remove("hidden");
        desktopTabs.style.display = "none";
        mobileTabs.style.display = "flex";
        btnDesktop.classList.remove("active");
        btnMobile.classList.add("active");
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showDesktop(id, btn) {
      document.querySelectorAll(".desktop-card").forEach(el => el.classList.remove("active"));
      document.querySelectorAll("#desktop-tabs .tab-btn").forEach(el => el.classList.remove("active"));
      const target = document.getElementById(id);
      if (target) target.classList.add("active");
      if (btn) btn.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showMobile(id, btn) {
      document.querySelectorAll(".mobile-card").forEach(el => el.classList.remove("active"));
      document.querySelectorAll("#mobile-tabs .tab-btn").forEach(el => el.classList.remove("active"));
      const target = document.getElementById(id);
      if (target) target.classList.add("active");
      if (btn) btn.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
